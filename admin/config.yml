backend:
  name: github
  repo: chloe-afif/my-site
  branch: main

media_folder: "images/uploads"
public_folder: "/my-site/images/uploads"

collections:
  - name: "projects"
    label: "Knitting Projects"
    folder: "data/projects"
    create: true
    slug: "{{slug}}"
    format: "json"
    fields:
      - { label: "Project Title", name: "title", widget: "string" }
      - { label: "Status", name: "status", widget: "select", options: ["WIP", "Finished"] }
      - { label: "Notes", name: "body", widget: "text", required: false }

